# Google AI to OpenAI Proxy - CI/CD 工作流
# GitHub Actions 自动化构建、测试和部署

name: CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'

  # 手动触发
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - staging
          - production

# 环境变量
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# 并发控制
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. 代码质量检查
  lint:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install flake8 mypy
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: 语法检查
        run: |
          python -m py_compile server.py

      - name: 代码风格检查
        run: |
          flake8 server.py --max-line-length=120 --ignore=E501,W503

      - name: 类型检查（可选）
        run: |
          mypy server.py --ignore-missing-errors || true

  # 2. 构建和测试
  build-and-test:
    name: 构建和测试
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: 构建 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: 运行容器测试
        run: |
          docker run --rm -e GOOGLE_API_KEY=test_key \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} \
            python -c "import server; print('✓ 容器启动测试通过')"

      - name: 测试 Docker Compose 配置
        run: |
          docker-compose config

  # 3. 推送到镜像仓库
  push:
    name: 推送镜像
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: 构建并推送多平台镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # 4. 部署到测试环境
  deploy-test:
    name: 部署到测试环境
    runs-on: ubuntu-latest
    needs: push
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment:
      name: test
      url: http://test.example.com:8787/health
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 部署到测试服务器
        run: |
          echo "部署到测试环境..."
          echo "触发远程部署脚本或 SSH 执行部署命令"
          # 示例：使用 SSH 部署
          # ssh user@test-server "cd /path/to/app && docker-compose pull && docker-compose up -d"

  # 5. 部署到生产环境（需要手动批准）
  deploy-production:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    needs: deploy-test
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://api.example.com/health
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 部署到生产服务器
        run: |
          echo "部署到生产环境..."
          echo "触发远程部署脚本或 SSH 执行部署命令"
          # 示例：使用 SSH 部署
          # ssh user@prod-server "cd /path/to/app && docker-compose pull && docker-compose up -d"

      - name: 发送部署通知
        run: |
          echo "发送部署通知..."
          # 示例：发送 Slack 通知
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"部署完成：${{ github.ref }}"}' \
          #   ${{ secrets.SLACK_WEBHOOK }}
