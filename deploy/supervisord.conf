[program:openai-proxy]
; Program definition
command=/usr/bin/python3 /opt/openai-proxy/async_server.py
directory=/opt/openai-proxy
user=openai-proxy
group=openai-proxy
autostart=true
autorestart=true
startretries=3
startsecs=10
stopsignal=SIGTERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/openai-proxy/supervisord.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/openai-proxy/supervisord_error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=GOOGLE_API_KEY="%(ENV_GOOGLE_API_KEY)s",PORT="%(ENV_PORT)s",LOG_LEVEL="%(ENV_LOG_LEVEL)s",LOG_FILE="/var/log/openai-proxy/async_server.log"
priority=999

; Security settings
user=openai-proxy
umask=022
; Security hardening - no new privileges
; security_opt=NoNewPrivileges=true

; Process monitoring
; Increased memory tracking for stability
; memory monitoring disabled due to psutil requirement

; Resource Limits
minfds=1024
minprocs=200

; Logging configuration
loglevel=info
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/run/supervisord.pid

; Event based management
; Send stdout/stderr to supervisord
stdout_events_enabled=false
stderr_events_enabled=false

; Environment variables for all programs
[supervisord]
; Supervisord main configuration
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor
nodaemon=false
silent=false

; Unix socket configuration
[unix_http_server]
file=/run/supervisor/supervisor.sock
chmod=0700
chown=root:root

; HTTP server for remote management (optional, disabled by default)
;[inet_http_server]
;port=127.0.0.1:9001
;username=user
;password=123

; Supervisorctl configuration
[supervisorctl]
serverurl=unix:///run/supervisor/supervisor.sock
prompt=supervisor

; Event listeners - notify on process state changes
[eventlistener:openai-proxy-events]
command=eventlistener-logger
events=PROCESS_STATE_STARTING,PROCESS_STATE_RUNNING,PROCESS_STATE_STOPPED,PROCESS_STATE_FATAL
redirect_stderr=true
stdout_logfile=/var/log/openai-proxy/eventlistener.log

; Groups for easier management
[group:openai-services]
programs=openai-proxy

; Include files
[include]
files=/etc/supervisor/conf.d/*.conf
